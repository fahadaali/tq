<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 116" role="img" aria-label="مؤسسة باذل الأهلية — BATHEL">
  <!-- باذل (calligraphy) بالأخضر الزمردي -->
  <text x="100" y="60" text-anchor="middle"
        font-family="'Aref Ruqaa','Amiri','Scheherazade New','Tahoma',serif"
        font-size="58" font-weight="700" fill="#13564a">باذل</text>
  <!-- الفلوريش القطري المميّز أعلى الكلمة -->
  <line x1="112" y1="34" x2="170" y2="14" stroke="#13564a" stroke-width="3.6" stroke-linecap="round"/>
  <!-- BATHEL بالذهبي -->
  <text x="100" y="104" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="27" font-weight="600" letter-spacing="3.5" fill="#b8986a">BATHEL</text>
</svg>
